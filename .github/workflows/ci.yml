name: ci

# workflow_dispatch is the manual escape hatch: it lets a run be launched for
# a push whose commits would otherwise skip CI, without pushing another commit.
on:
  push:
    # Filtered to the merge targets: a feature branch is covered by its
    # pull_request run, and a push trigger there would run the same commit twice.
    branches:
      - main
      - 'MOODLE_*_STABLE'
  pull_request:
  workflow_dispatch:

# Supersede a run when new commits arrive on the same pull request: pushing
# three fixes in a row otherwise leaves three full pipelines running to the end.
# Never on main - each merge there is the only run its commit will ever get, and
# a second merge landing quickly must not cancel the first one's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One reusable-workflow call per supported Moodle branch (version.php
  # $plugin->supported) — update these jobs when the supported range changes,
  # in the same commit as the version.php change.
  #
  # This theme is a child of Boost Union, so Boost Union must be checked out
  # alongside it or the theme cannot be installed. The branch pinned here
  # follows $plugin->supported: Boost Union ships one stable branch per Moodle
  # release; until it ships MOODLE_503_STABLE, its 5.3 port lives on upgrade-503.
  #
  # local_unlistedcourses is a declared dependency in version.php: the course
  # renderer calls its access predicates.
  #
  # customfield_picture is optional and NOT in version.php: the landing page's picture
  # fields (the four badges and the share picture) are of its type, provisioned
  # and drawn only where it is installed and enabled. It is here so the suite
  # exercises that integration; the tests that need it skip themselves without it.
  #
  # local_page is optional and deliberately NOT in version.php: the category
  # showcase draws a category's pages under its hero when it is installed and
  # nothing when it is not. It is here only to run the pages strip's
  # integration tests against the real plugin; they skip themselves where it
  # is absent.
  #
  # block_compass is optional and NOT in version.php: the theme answers its
  # course_badges, category_badges and course_kinds hooks (the crests on the
  # block's cards and open-for-enrolment line, and its courses told from
  # events) only where it is installed. It is here to exercise those
  # callbacks and theme_dimensions_compass.feature; the PHPUnit tests skip
  # themselves where the block is absent, and a site without it excludes the
  # feature with --tags '~@block_compass'.
  #
  # tool_courserating is optional and NOT in version.php: the category
  # showcase prints its ratings on the course cards and in the course dialogue
  # where it is installed and rates some course, and reads nothing of it where
  # it is not. It is here so the rating tests run against the real plugin
  # (upstream's MOODLE_405_STABLE, whose $plugin->supported is [405, 503]); the
  # tests skip themselves where it is absent.
  #
  # behat-suite is required for a theme: core runs a theme's own features in a
  # suite named after the theme, never in the default one
  # (behat_config_util::get_behat_suites()), so without it every Behat job
  # collects no scenarios and still passes.
  ci-503:
    name: Moodle 5.03
    uses: uaiblaine/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      runner: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || '' }}
      moodle-core-branch: MOODLE_503_STABLE
      behat-suite: "dimensions"
      plugin-dependencies: |
        moodle-an-hochschulen/moodle-theme_boost_union,upgrade-503
        uaiblaine/moodle-local_unlistedcourses,MOODLE_503_STABLE
        uaiblaine/moodle-customfield_picture,master
        uaiblaine/moodle-local_page,main
        uaiblaine/moodle-block_compass,MOODLE_503_STABLE
        marinaglancy/moodle-tool_courserating,MOODLE_405_STABLE
