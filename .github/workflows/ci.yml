name: ci

# workflow_dispatch is the manual escape hatch: it lets a run be launched for
# a push whose commits would otherwise skip CI, without pushing another commit.
on:
  push:
    # Filtered to the merge targets: a feature branch is covered by its
    # pull_request run, and a push trigger there would run the same commit twice.
    branches:
      - main
      - 'MOODLE_*_STABLE'
  pull_request:
  workflow_dispatch:

# Supersede a run when new commits arrive on the same pull request: pushing
# three fixes in a row otherwise leaves three full pipelines running to the end.
# Never on main - each merge there is the only run its commit will ever get, and
# a second merge landing quickly must not cancel the first one's verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One reusable-workflow call per supported Moodle branch (version.php
  # $plugin->supported) — update these jobs when the supported range changes,
  # in the same commit as the version.php change.
  #
  # This theme is a child of Boost Union, so Boost Union must be checked out
  # alongside it or the theme cannot be installed. The branch pinned here
  # follows $plugin->supported: Boost Union ships one stable branch per Moodle
  # release, and MOODLE_502_STABLE is the one that matches Moodle 5.2.
  #
  # local_unlistedcourses and customfield_picture are declared dependencies in
  # version.php: the course renderer calls the first one's access predicates,
  # and the hotsite's picture fields (the four badges and the share picture)
  # are of the second one's type.
  #
  # local_page is optional and deliberately NOT in version.php: the category
  # showcase draws a category's pages under its hero when it is installed and
  # nothing when it is not. It is here only to run the pages strip's
  # integration tests against the real plugin; they skip themselves where it
  # is absent.
  #
  # behat-suite is required for a theme: core runs a theme's own features in a
  # suite named after the theme, never in the default one
  # (behat_config_util::get_behat_suites()), so without it every Behat job
  # collects no scenarios and still passes.
  ci-502:
    name: Moodle 5.02
    uses: moodle-an-hochschulen/moodle-workflows/.github/workflows/moodle-plugin-ci.yml@main
    with:
      moodle-core-branch: MOODLE_502_STABLE
      behat-suite: "dimensions"
      plugin-dependencies: |
        moodle-an-hochschulen/moodle-theme_boost_union,MOODLE_502_STABLE
        uaiblaine/moodle-local_unlistedcourses,main
        uaiblaine/moodle-customfield_picture,master
        uaiblaine/moodle-local_page,main
