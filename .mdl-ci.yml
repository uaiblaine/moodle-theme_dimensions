# Local-only extra plugins for moodle-dev's `mdl ci` (bin/lib/local-extras.sh there).
# GitHub's CI never reads this file, and it is export-ignored. The theme asks each of these
# plugins at run time and declares none of them, and its ci.yml installs none, so the tests
# that need one skip on GitHub and the mutation gates that only those tests can redden read
# green there (the stage 5b block and the loginshell block of mutations/gates.conf):
#   enrol_apply           the pending, waiting-list and switched-off application tests
#   enrol_autoenrol       the autoenrol adapter and the classifier's autoenrol rules
#   enrol_coursecompleted the resolver's conditional prerequisite
#   auth_loginsteps       the second factor on the plugin's shell (private: GitHub cannot install it)
#   mod_subcourse         the Trail model's steps; GitHub's ci.yml installs it too, and this entry stands in
#                         until moodle-dev's extra_deps_for() lists it beside the theme's other optional plugins
#   filter_shortcodes     the [relatedcourses] shortcode through the filter; GitHub's ci.yml installs it too, as
#                         mod_subcourse above
#   enrol_conditional     the resolver's conditional tests and the superset test's conditional shapes (the
#                         enrolconditional block of mutations/gates.conf); its engine, local_enrolconditions,
#                         arrives through the method's own $plugin->dependencies
extra-plugins:
  - repo: moodle-enrol_apply
    path: enrol/apply
    branches: [MOODLE_503_STABLE]
  - repo: moodle-enrol_autoenrol
    path: enrol/autoenrol
    branches: [MOODLE_503_STABLE]
  - repo: moodle-enrol_coursecompleted
    path: enrol/coursecompleted
    branches: [MOODLE_503_STABLE]
  - repo: moodle-auth_loginsteps
    path: auth/loginsteps
    branches: [MOODLE_503_STABLE]
  - repo: moodle-mod_subcourse
    path: mod/subcourse
    branches: [MOODLE_503_STABLE]
  - repo: moodle-filter_shortcodes
    path: filter/shortcodes
    branches: [MOODLE_503_STABLE]
  # The ref is the commit of the fork's audited line the method's public helpers (is_self_enrol_available(),
  # evaluate_conditions()) are relied on at; the fork's main contains it.
  - repo: moodle-enrol_conditional
    path: enrol/conditional
    branches: [MOODLE_503_STABLE]
    ref: 593b83cca6d132e20c9547ea6f3c44a162b3d004
