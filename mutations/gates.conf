# Stage 5b of the enrolment matrix. The classifier reads local_unlistedcourses' relationship types
# first-class: relationship_waitlisted stops a waiting-list row from setting the rescue's pending
# flags, relationship_suspended and relationship_expired let those rows fall through to what the
# instances offer, relationship_unknown and relationship_fold_raw take a type the theme does not know
# (an undefined rank), relationship_ended_rescue lets a suspended or ended row rescue a course the
# plugin withholds, relationship_expired_latest keeps the first end date seen. The offers: key
# (above), conditional for anybody (classifier_conditional_prerequisite), conditional above an open
# route (classifier_conditional_rank), enrol_coursecompleted forgotten
# (classifier_conditional_plugin), a prerequisite left on a card a better offer won
# (classifier_prerequisite_cleared). The chips: chip_waitlisted and chip_key give a state a chip the
# toolbar does not draw, population_counts_by_chip and population_filter_by_chip count and keep by
# state. The card: cards_routes_relationships_only asks the plugin's batch about every card,
# card_route_relationships_only prints a route beside any state, card_route_never_mayenter for a
# viewer who may walk in, card_route_cta drops "Enrol now", card_key_standard_page sends the key to
# the landing page (which draws no key form), card_key_not_entered lets the key walk in,
# card_conditional_needs_prerequisite keeps a conditional card with nothing to name,
# card_prerequisite_plain escapes the name twice, card_pill_icon_hidden lets a reader announce the
# icon, badge_dark_pair_waitlisted loses a dark pair, ws_card_route_declared drops the route from the
# web service's allowlist. The landing page: resolver_ended_relationship and resolver_waitlisted lose the
# relationship, resolver_completed_not_fallback lists enrol_coursecompleted's widget again,
# landing_waitlisted_heading draws two headings, landing_conditional_hides_closed keeps the closed
# sentence beside the prerequisite, landing_suspended_note_drawn drops a note from the template. The
