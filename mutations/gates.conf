# The posters and the panel between their rows, server side. The panel is an address before it is
# anything else - `open` and `psort` travel in every link the page mints - so four gates hold the
# address: panel_open_child_only trusts whatever id it names (an oracle, and a panel on a page
# with no poster for it), panel_psort_allowlist trusts whatever order it names,
# hero_fold_keeps_panel drops it from the page's own parameters (the hero's fold form, the pager
# and the quick dates then shut the panel), and open_reveal_opens_details draws the reveal closed
# over the open poster past the twenty-fourth. Three hold what the server draws:
# panel_one_fetch_server resolves every poster's panel (a whole listing each, counted by
# budget_test), panel_perpage_eight lets the rail run to the site's page size, and
# poster_empty_at_rest_only turns an empty poster into a link under a criterion too, where
# "nothing matches here" is an answer. Three hold the visitor's merely listed area (listed, with
# no page a visitor may open): panel_anon_listed_text_card draws its files, which the public route
# refuses; panel_d20_public_only lists it as a person's listing, non-public courses included (on
# the request path such a page is already a visitor's, so the line it flips holds the pure
# function's contract - "the public slice, whatever the page" - which panel_criteria's unit test
# pins); panel_cta_shell spells the panel's ways out with the logged-in shell. And three hold the
# poster's style attribute, a CSS-context sink: poster_ink_sanitised prints the ink as the payload
# holds it, poster_mark_url_wired prints the watermark's crest without the style url guard, and
# poster_mark_alpha_floor stops stepping the watermark down, so the name falls under AA over it.
# listing_clear_keeps_sort_toolbar is the twin of listing_clear_keeps_sort over the toolbar's own
# builder, which carries the panel as well as the organisation.
