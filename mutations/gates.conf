# The public root and the directory past twenty-five. Whether the root is public is a SETTING, so
# root_anonymous_refused breaks the decision layer's own refusal - the one clause that reads the
# setting and keeps the guest out - which is where the answer is decided for every caller and not
# only for that page. The renderer's line is still correct; what it guards is which PAGE the guest
# account gets, and population_test owns the refusal itself.
# root_public_setting is the setting read, one layer up: without it the root is public
# unconditionally, which is the whole top level of every site on the internet by upgrade.
# root_directory_public_only is the card rule, which is NOT the population rule: the scope admits
