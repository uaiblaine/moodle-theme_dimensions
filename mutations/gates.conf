# The posters and the panel, client side and stylesheet. Six gates are over JavaScript and one
# over SCSS, all proven by a source-shape test and never by a browser - the rule this file states
# for every js_ line, and each JavaScript one also reddens its file's build-currency assertion.
# js_panel_sends_no_direct adds a direct key to a panel's request: the service refuses the whole
# call, so no panel opens. js_panel_one_open leaves the previous
# poster open while the panel moves on (one panel at a time). js_panel_escape_focus closes on
# Escape and drops the focus to the body. js_panel_replace_state makes every panel a history
# entry. js_panel_forms_follow stops the toolbar form, the hero's fold form and the clear link
# following the panel, so each reloads the page with the panel it had when it loaded.
# js_mini_no_peek arms the listing's peek and observer on the panel's cards. And
# poster_pan_fine_pointer_only lets the poster's pan out of its one media query, onto a finger and
# onto a reader who asked for less movement.
# R4c retired js_panel_escape_focus, js_panel_forms_follow, js_panel_one_open, js_panel_replace_state with the AMD
# module they broke (categoryareapanel.js); the component's gates and Jest hold the rule.
