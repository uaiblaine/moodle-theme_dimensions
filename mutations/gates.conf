# Round B of the category editor (2026-10-11): the inherited colour pair, the default organisation
# and the card's own text. The pair is resolved in one statement for a grid (inherit_batched, held
# by a slope against a grid of cards with pairs of their own), from the rows WITH a pair of their own
# only (inherit_own_rows_only), the deepest winning (inherit_nearest_wins); the cache holds the
# resolved pair, so each of the three writers that can change a descendant's pair drops it whole
# (inherit_save_forgets_all, inherit_delete_forgets_all, inherit_move_forgets_all - the last is the
# course_category_updated observer, reached through core's own change_parent()). The default
# organisation is resolved in criteria's constructor (default_sort_fallback), read by the page's
# entry and by the web service (default_sort_from_request, default_sort_web_service), and every
# address round-trips against the CATEGORY's default, not the theme's (default_sort_names_grouped,
