# Round I, lot C1 (2026-10-11): the state a reader leaves each category in, the open area's colour
# and the folded hero's crests. The state is remembered for a real account only
# (remembered_guest_refused, and remembered_ws_guest at the service), bounded by count and by
# length (remembered_lru_count, remembered_length_bound), validated on the way in - a refused value
# keeps what the entry held (remembered_write_refuses_invalid, remembered_option_range) - and on the
# way out (remembered_validated_on_read); the service admits only a category the reader may discover
# (remembered_ws_guard). The page reads it for a bare address only (remembered_bare_only), on the
# logged-in shell only (remembered_from_request, remembered_anonymous_never), and every address
# minted for a remembered category names its organisation, server and client
# (remembered_names_sort, remembered_rows_flag, js_url_names_remembered_sort). The client remembers
# only on a real account's category page (js_remember_guard) and "clear filters" clears the
# remembered filters (js_clear_remembers). The view is remembered per category from the address and
# read back before the global one (remembered_view_records, remembered_view_entry). The open area's
# band reaches the panel from the server and from the module (panel_style_area_band,
# js_panel_copies_band) and paints the rail (panel_rail_area_colour); the other posters' cards dim
# (spotlight_dims_the_card); a compact hero keeps its crests (hero_compact_keeps_crests). Every js_
# gate also reddens the build-currency assertion, as every js_ gate of this file does.
