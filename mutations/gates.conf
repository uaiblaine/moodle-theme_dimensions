# Mutation spec for theme_dimensions.
#
# Each line breaks ONE guard and the sweep records which tests go red. A guard
# that reddens nothing is the finding: the suite would be green against code
# that no longer withholds what it claims to withhold, or that withholds a
# profile from the staff who administer the platform.
#
# A PATTERN IS THE SMALLEST EXPRESSION OF THE GUARD, NEVER THE BLOCK AROUND IT, and never the
# code that FOLLOWS it. A pattern anchored on a whole branch body, or on the lines after its
# target, goes dead the moment anything is inserted there - and a dead pattern takes the whole
# sweep down at that line, with every gate below it unrun. Anchor on the condition, which is the
# guard. The only thing that can see a dead pattern is the dry-match of every line against a copy
# of the tree, so write the pattern small and run the dry-match before believing a sweep.
#
# tag | file relative to the repo | perl script relative to this directory
